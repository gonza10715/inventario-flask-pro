name: Pruebas de inventario
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "inventario web/requirements.txt" pytest
      - name: Comprobar sintaxis
        run: python -m compileall -q "inventario web"
      - name: Ejecutar pruebas aisladas
        run: python -m pytest -q test_app.py

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install application and browser dependencies
        run: |
          python -m pip install -r "inventario web/requirements.txt" playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Check Flask flows in Chromium at desktop and mobile widths
        run: python browser_checks.py
